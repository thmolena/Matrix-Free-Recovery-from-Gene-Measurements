[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mfcell"
version = "2.0.0"
description = "Leakage-audited matrix-free residual propagation for public single-cell data"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{ name = "Molena Huynh" }]
dependencies = [
  "numpy==2.4.3",
  "scipy==1.17.1",
  "scikit-learn==1.8.0",
  "matplotlib==3.10.8",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mfcell-reproduce = "mfcell.reproduce:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["mfcell*"]

[tool.setuptools.package-data]
mfcell = [
  "data/source/*.tar.gz",
  "results/*.json",
  "results/*.tex",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
